# Runs the backend test suite and lint on every push and pull request, BEFORE anything
# reaches a deploy. ~3-5 minutes. The suite needs a real Postgres and Redis (the tests
# deliberately do not mock the database or the call-lease Redis scripts), provided below as
# service containers; tests/conftest.py points at them and clears every external credential,
# so this job never calls a real paid service.
name: CI

on:
  push:
  pull_request:

# A newer push to the same branch supersedes an older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mira
          POSTGRES_PASSWORD: mira
          POSTGRES_DB: mira_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mira -d mira_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      # Native build prerequisites for aiortc (pulled in by pipecat's WebRTC extra); same set
      # the Dockerfile installs.
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libopus-dev libvpx-dev

      # The exact, hash-verified set production installs (see the Dockerfile) -- so CI tests
      # what ships, not whatever the newest releases happen to be today.
      - name: Install dependencies
        run: pip install -r requirements.lock

      # Fails if requirements.txt was edited without regenerating requirements.lock.
      - name: Lock file is up to date
        run: |
          pip install uv
          uv pip compile requirements.txt --universal --python-version 3.12 --generate-hashes -o requirements.lock --quiet
          git diff --exit-code requirements.lock || {
            echo "::error::requirements.lock is out of date. Run: uv pip compile requirements.txt --universal --python-version 3.12 --generate-hashes -o requirements.lock"
            exit 1
          }

      - name: Lint (ruff.toml)
        run: ruff check .

      - name: Tests
        run: pytest -q
