# Behavioural evals for the voice agent (docs/documentation/golden-eval-suite.md, Task 9 of
# docs/tasks/call-fluency-fixes.md): replays scripted guest conversations against the real
# prompt, tools and guards and has a judge model grade the replies.
#
# REPORT-ONLY for now: `continue-on-error` keeps a failing scenario from failing the check, and the
# results are attached as an artifact and written to the job summary. Make it blocking after two weeks
# without a flaky result by deleting the `continue-on-error` line below.
#
# Needs two repository secrets, because the agent and the judge call a real model:
#   GROQ_API_KEY  -- a key on a plan that can carry the Lead Agent prompt (~19k tokens; the free tier
#                    allows 8k tokens a minute and returns 413)
# It never touches a real host's data: the bot refuses any database whose name does not contain
# "eval" or "test" (backend/app/voice/eval_mode.py), and this job creates its own `mira_eval`.
name: Voice agent evals

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/app/voice/**"
      - "backend/app/prompts/**"
      - "backend/app/services/property/**"
      - "backend/eval/**"

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true # report-only; see the header
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mira
          POSTGRES_PASSWORD: mira
          POSTGRES_DB: mira_eval
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mira -d mira_eval"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12

    env:
      DATABASE_URL: postgresql+asyncpg://mira:mira@localhost:5432/mira_eval
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: development
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-eval.txt

      # Same native prerequisites as the Dockerfile (aiortc, pulled in by pipecat's WebRTC extra).
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libopus-dev libvpx-dev

      # requirements-eval.txt = requirements.txt + the `pipecat` CLI, which production does not carry.
      - name: Install dependencies
        run: pip install -r requirements-eval.txt

      - name: Run the eval suite
        run: pipecat eval suite eval/manifest.yaml --debug 2>&1 | tee eval-output.txt

      - name: Summary
        if: always()
        run: |
          {
            echo "## Voice agent evals (report-only)"
            echo '```'
            tail -n 60 eval-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-runs
          path: |
            backend/eval-runs/
            backend/eval-output.txt
