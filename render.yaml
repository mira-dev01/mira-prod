databases:
  - name: mira-db
    plan: free
    databaseName: mira
    user: mira

services:
  - type: web
    name: mira-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mira-db
          property: connectionString
      # Render has no Blueprint property for a service's public HTTPS URL
      # (only its private-network hostname, which a browser can't reach) --
      # fill these in manually with the real https://*.onrender.com URLs
      # after the first deploy. See deploy steps.
      - key: FRONTEND_BASE_URL
        sync: false
      - key: BACKEND_BASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "1440"
      - key: LLM_PROVIDER
        value: openrouter
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-oss-120b
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_STT_MODEL
        value: saaras:v3
      - key: SARVAM_TTS_MODEL
        value: bulbul:v3
      - key: SARVAM_TTS_SPEAKER
        value: roopa
      - key: EXOTEL_SID
        sync: false
      - key: EXOTEL_API_KEY
        sync: false
      - key: EXOTEL_API_TOKEN
        sync: false
      - key: EXOTEL_SUBDOMAIN
        value: api.exotel.com
      - key: EXOTEL_WEBHOOK_TOKEN
        generateValue: true
      - key: EXOTEL_VIRTUAL_NUMBER
        sync: false

  - type: web
    name: mira-frontend
    runtime: node
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm run start -- -p $PORT
    envVars:
      # Must be the backend's public URL + /api/v1, e.g.
      # https://mira-backend.onrender.com/api/v1 -- fill in after first
      # deploy. NEXT_PUBLIC_* vars are baked in at build time, so changing
      # this requires a redeploy (Render does this automatically on save).
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
